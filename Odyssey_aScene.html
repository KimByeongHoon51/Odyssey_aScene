<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Odyssey_aScene</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
:root{--u:3px;--gold:#e8c56a;--ink:#f3e6c8;--red:#c0392b}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Galmuri11','Galmuri9',monospace;color:var(--ink);user-select:none;-webkit-user-select:none}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:960px;height:540px;background:#000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.layer{position:absolute;inset:0;pointer-events:none}
.hidden{display:none!important}
.tx{text-shadow:0 calc(var(--u)*1) 0 #000,calc(var(--u)*1) 0 0 #000,calc(var(--u)*-1) 0 0 #000,0 calc(var(--u)*-1) 0 #000}

/* HUD */
#hudTL{position:absolute;left:calc(var(--u)*6);top:calc(var(--u)*5)}
#hudStage{font-size:calc(var(--u)*9);color:var(--gold);letter-spacing:calc(var(--u)*.3)}
#hudKills{font-size:calc(var(--u)*6);margin-top:calc(var(--u)*2)}
#pauseBtn{position:absolute;right:calc(var(--u)*5);top:calc(var(--u)*5);width:calc(var(--u)*14);height:calc(var(--u)*14);pointer-events:auto;cursor:pointer;
  background:#2a1d14;border:calc(var(--u)*1) solid var(--gold);box-shadow:0 calc(var(--u)*1) 0 #000;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);padding:0}
#pauseBtn i{display:block;width:calc(var(--u)*2);height:calc(var(--u)*6);background:var(--ink)}
#pauseBtn:hover{background:#4a3424}
#hudWeapons{position:absolute;left:calc(var(--u)*5);bottom:calc(var(--u)*5);display:flex;gap:calc(var(--u)*3)}
.slot{position:relative;width:calc(var(--u)*18);height:calc(var(--u)*18);background:rgba(20,12,8,.8);border:calc(var(--u)*1) solid #8a6a3a;box-shadow:0 calc(var(--u)*1) 0 #000}
.slot.off{opacity:.35}
.slot img{position:absolute;left:calc(var(--u)*2);top:calc(var(--u)*2);width:calc(var(--u)*13);height:calc(var(--u)*13);image-rendering:pixelated}
.slot span{position:absolute;right:calc(var(--u)*1);bottom:calc(var(--u)*0);font-size:calc(var(--u)*6);color:#fff}
.slot.bump{animation:bump .4s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
#bossBar{position:absolute;left:50%;top:calc(var(--u)*6);transform:translateX(-50%);width:calc(var(--u)*130);text-align:center}
#bossName{font-size:calc(var(--u)*6);color:#ff9a7a;margin-bottom:calc(var(--u)*2)}
#bossBar .bar{height:calc(var(--u)*4);background:#200;border:calc(var(--u)*1) solid #000;box-shadow:0 0 0 calc(var(--u)*1) #8a3a2a}
#bossFill{height:100%;width:100%;background:linear-gradient(#e0503a,#a02818)}

/* captions */
#caption{display:flex;flex-direction:column;align-items:center;justify-content:center}
#capMain{font-size:calc(var(--u)*18);color:var(--gold);letter-spacing:calc(var(--u)*1)}
#capSub{font-size:calc(var(--u)*7);margin-top:calc(var(--u)*4)}
#caption.show{animation:capIn .5s ease-out}
@keyframes capIn{0%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
#toast{position:absolute;left:50%;top:calc(var(--u)*34);transform:translateX(-50%);font-size:calc(var(--u)*7);color:#fff;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;text-align:center}
.screen.dim{background:rgba(0,0,0,.6)}
.btn{font-family:inherit;font-size:calc(var(--u)*8);color:var(--ink);background:#3a2618;border:calc(var(--u)*1) solid var(--gold);
  padding:calc(var(--u)*3) calc(var(--u)*10);margin:calc(var(--u)*3);cursor:pointer;box-shadow:0 calc(var(--u)*2) 0 #000;min-width:calc(var(--u)*90)}
.btn:hover,.btn:focus{background:#6a4424;outline:none}
.btn:active{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*1) 0 #000}
#title h1{font-family:'Galmuri11',monospace;font-weight:normal;font-size:calc(var(--u)*20);margin:0;color:var(--gold);letter-spacing:calc(var(--u)*1)}
#title .sub{font-size:calc(var(--u)*8);margin:calc(var(--u)*4) 0 calc(var(--u)*2)}
#title .desc{font-size:calc(var(--u)*5.5);color:#cdb894;margin-bottom:calc(var(--u)*12);line-height:1.6}
#title .help{font-size:calc(var(--u)*5);color:#a89070;margin-top:calc(var(--u)*8)}
.scrTitle{font-size:calc(var(--u)*14);color:var(--gold);margin-bottom:calc(var(--u)*10)}
#overScr .scrTitle{color:#e06a50}
.scrInfo{font-size:calc(var(--u)*6);margin:calc(var(--u)*-6) 0 calc(var(--u)*8);color:#cdb894}

/* ending text */
#endText{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(var(--u)*10)}
#endText p{margin:calc(var(--u)*1.5) 0;font-size:calc(var(--u)*6.5);opacity:0;transition:opacity 1.2s}
#endText p.on{opacity:1}
#endText p.fin{color:var(--gold);font-size:calc(var(--u)*8);margin-top:calc(var(--u)*4)}
#endText .btn{opacity:0;transition:opacity 1s;pointer-events:none}
#endText .btn.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>

  <div id="hud" class="layer hidden">
    <div id="hudTL" class="tx"><div id="hudStage">스테이지 1</div><div id="hudKills">처치 0 / 50</div></div>
    <button id="pauseBtn" title="일시정지 (ESC)"><i></i><i></i></button>
    <div id="bossBar" class="hidden tx"><div id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
    <div id="hudWeapons" class="tx">
      <div class="slot" id="slotBow"><img id="icoBow" alt="활"><span id="cBow">1</span></div>
      <div class="slot off" id="slotSword"><img id="icoSword" alt="검"><span id="cSword">0</span></div>
      <div class="slot off" id="slotAxe"><img id="icoAxe" alt="도끼"><span id="cAxe">0</span></div>
    </div>
  </div>
  <div id="caption" class="layer hidden tx"><div id="capMain"></div><div id="capSub"></div></div>
  <div id="toast" class="tx"></div>

  <div id="title" class="screen tx">
    <h1>Odyssey_aScene</h1>
    <div class="sub">구혼자들의 연회장</div>
    <div class="desc">스무 해 만에 거지의 모습으로 돌아온 이타카의 왕.<br>그가 활에 시위를 거는 순간, 연회장은 전장이 된다.</div>
    <button class="btn" id="startBtn">시작</button>
    <div class="help">이동: 방향키 / WASD &nbsp;·&nbsp; 일시정지: ESC</div>
  </div>
  <div id="pauseScr" class="screen dim tx hidden">
    <div class="scrTitle">일시정지</div>
    <button class="btn" id="resumeBtn">계속하기</button>
    <button class="btn" id="toTitleBtn">처음으로</button>
  </div>
  <div id="overScr" class="screen dim tx hidden">
    <div class="scrTitle">오디세우스가 쓰러졌다</div>
    <div class="scrInfo" id="overInfo"></div>
    <button class="btn" id="retryBtn">현재 스테이지 재시작</button>
    <button class="btn" id="quitBtn">종료</button>
  </div>
  <div id="endText" class="layer tx hidden">
    <p>구혼자들은 모두 쓰러졌다.</p>
    <p>스무 해의 방랑 끝에, 오디세우스는 마침내 집으로 돌아왔다.</p>
    <p>페넬로페는 오래도록 그의 얼굴을 바라보았다.</p>
    <p class="fin">— 이타카에 다시 평화가 찾아왔다 —</p>
    <p id="endStats"></p>
    <button class="btn" id="endBtn">처음으로</button>
  </div>
</div>

<script>
'use strict';
// =====================================================================
//  기본 설정
// =====================================================================
const W = 320, H = 180;          // 내부 해상도
const MAPW = 640, MAPH = 400;    // 연회장 크기
const PLAY = { x0: 18, y0: 58, x1: 622, y1: 386 };   // 이동 가능 영역
const ENEMIES_PER_STAGE = 50;
const PLAYER_SPEED = 70;
const PLAYER_HP = 100;
const INVULN = 2;
const BOW = { dmg: 50, interval: 0.6, range: 210, speed: 230 };
const SWORD = { dmg: 4, radius: 22, spin: 4.6, hit: 7, tick: 0.12, knock: 2 };
const AXE = { dmg: 8, radius: 42, spin: -2.2, hit: 9, tick: 0.12, knock: 9 };
const AXE_ROW_Y = 148;           // 장식 도끼 6쌍 줄
const START = { x: 320, y: 214 };

const ETYPES = {
  fist:     { hp: 50,  dmg: 5,  spd: 70, wpn: [] },
  sword:    { hp: 70,  dmg: 8,  spd: 70, wpn: ['sword'] },
  axe:      { hp: 100, dmg: 12, spd: 60, wpn: ['axe'] },
  swordaxe: { hp: 130, dmg: 15, spd: 60, wpn: ['sword', 'axe'] },
  spear:    { hp: 100, dmg: 18, spd: 77, wpn: ['spear'] },
};
const STAGES = [
  { mix: ['fist'],              sub: '맨주먹으로 달려드는 구혼자들' },
  { mix: ['fist', 'sword'],     sub: '검을 집어 든 자들' },
  { mix: ['sword'],             sub: '검을 든 구혼자들' },
  { mix: ['sword', 'axe'],      sub: '검과 도끼' },
  { mix: ['axe'],               sub: '도끼를 든 구혼자들' },
  { mix: ['swordaxe'],          sub: '검과 도끼를 함께 쥔 자들' },
  { mix: ['swordaxe', 'spear'], sub: '창이 들어오다' },
  { mix: ['spear'],             sub: '창을 든 구혼자들' },
];
const BOSSES = [
  { name: '맨주먹의 안티노오스',   hp: 500,  dmg: 10, spd: 52, ab: ['dash'],                  acd: 3.0, w: [],                tunic: ['#8b2a2a', '#5e1a1a'] },
  { name: '장검의 안티노오스',     hp: 650,  dmg: 14, spd: 52, ab: ['dash'],                  acd: 2.6, w: ['sword'],         tunic: ['#2a4f8b', '#1a335e'] },
  { name: '쌍검의 안티노오스',     hp: 800,  dmg: 16, spd: 52, ab: ['dash', 'spin'],          acd: 2.6, w: ['sword', 'sword'], tunic: ['#2a6f7a', '#1a4a52'] },
  { name: '도끼의 안티노오스',     hp: 950,  dmg: 18, spd: 46, ab: ['slam'],                  acd: 2.8, w: ['axe'],           tunic: ['#7a5a1f', '#523c14'] },
  { name: '쌍도끼의 안티노오스',   hp: 1100, dmg: 20, spd: 46, ab: ['slam', 'spin'],          acd: 2.6, w: ['axe', 'axe'],    tunic: ['#2a7a4a', '#1a5232'] },
  { name: '검과 도끼의 안티노오스', hp: 1250, dmg: 22, spd: 48, ab: ['dash', 'slam'],          acd: 2.4, w: ['sword', 'axe'],  tunic: ['#6a2a7a', '#461a52'] },
  { name: '창과 도끼의 안티노오스', hp: 1400, dmg: 24, spd: 50, ab: ['dash', 'slam', 'spin'],  acd: 2.2, w: ['spear', 'axe'],  tunic: ['#3a3a44', '#22222a'] },
  { name: '황금 창의 안티노오스',   hp: 1600, dmg: 25, spd: 58, ab: ['triple'],                acd: 2.4, w: ['spear'],         tunic: ['#5a1f6e', '#3a1048'], gold: true },
];

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const $ = id => document.getElementById(id);

// =====================================================================
//  도트 스프라이트
// =====================================================================
function makeSprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const col = pal[r[x]]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } } });
  return c;
}
function flipSprite(src) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0); return c;
}
function tintSprite(src, col) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c;
}

// 오디세우스 — 장발, 수염 많은 거지 차림 (정면)
const ODY_BODY = [
  '.....kkkkkk.....',
  '....khhhhhhk....',
  '...khhhhhhhhk...',
  '...khsssssshk...',
  '..khhsesseshhk..',
  '..khhsbssbshhk..',
  '..khhbbbbbbhhk..',
  '..khhbbbbbbhhk..',
  '..kcchbbbbhcck..',
  '.kccccbbbbcccck.',
  '.ksccdcbbcdccsk.',
  '.ksccrrrrrrccsk.',
  '..kcdccccccdck..',
  '..kccdccccdcck..',
];
const LEGS_A = ['...kff....ffk...', '...kkk....kkk...'];
const LEGS_B = ['....kff..ffk....', '....kkk..kkk....'];
const ODY_PAL = { k: '#1a120c', h: '#4a3a2c', s: '#c48a5e', e: '#120c08', b: '#8a7862', c: '#7d6646', d: '#5a4630', r: '#a8905a', f: '#3a2a1a' };
// 오디세우스 — 측면 (오프닝용)
const ODY_SIDE = [
  '....kkkkk.......',
  '...khhhhhk......',
  '..khhhhhhhk.....',
  '..khhhhsssk.....',
  '..khhhhsesk.....',
  '..khhhbsssk.....',
  '..khhbbbbbk.....',
  '..khhbbbbbk.....',
  '..kcchbbbk......',
  '.kcccccck.......',
  '.kcccdcck.......',
  '.kccrrrck.......',
  '.kcccccck.......',
  '..kcdcdck.......',
  '..kff.kfk.......',
  '..kkk.kkk.......',
];
// 구혼자
const SUITOR_BODY = [
  '................',
  '.....kkkkkk.....',
  '....khhhhhhk....',
  '....khhhhhhk....',
  '....khsssshk....',
  '....ksessesk....',
  '....kssssssk....',
  '.....kssssk.....',
  '...kttttttttk...',
  '..ksttttttttsk..',
  '..ksuttttttusk..',
  '...kggggggggk...',
  '...kttttttttk...',
  '...kuttkkttuk...',
];
const LEGS_SA = ['....kff..ffk....', '....kkk..kkk....'];
const LEGS_SB = ['...kff....ffk...', '...kkk....kkk...'];
const HELM_TOP = '.......cc.......';
const CROWN = ['....kgkggkgk....', '....kggggggk....'];
const HAIRS = ['#2a1d14', '#5a3a1e', '#a07a3a', '#1a1a1a', '#6e4a2a'];
const TUNICS = [['#8b2a2a', '#5e1a1a'], ['#2a4f8b', '#1a335e'], ['#2a7a4a', '#1a5232'], ['#7a5a1f', '#523c14'], ['#6a2a7a', '#461a52'], ['#2a6f7a', '#1a4a52'], ['#9a8a6a', '#6a5a40']];
// 페넬로페
const PEN_BODY = [
  '.....kkkkkk.....',
  '....khhhhhhk....',
  '...khhhhhhhhk...',
  '...khhsssshhk...',
  '...khsesseshk...',
  '...khsssssshk...',
  '...khhsssshhk...',
  '..khhhwwwwhhhk..',
  '..khhwwwwwwhhk..',
  '..khswwwwwwshk..',
  '..kkswwggwwskk..',
  '...kwwwwwwwwk...',
  '...kwwvwwvwwk...',
  '..kwwwvwwvwwwk..',
  '..kwwwwwwwwwwk..',
  '...kkkkkkkkkk...',
];
const PEN_PAL = { k: '#160e0a', h: '#2a1a12', s: '#d9a47a', e: '#120c08', w: '#e9e1cf', v: '#8fa8c8', g: '#c9a24a' };

const SPR = {};
SPR.odyA = makeSprite(ODY_BODY.concat(LEGS_A), ODY_PAL);
SPR.odyB = makeSprite(ODY_BODY.concat(LEGS_B), ODY_PAL);
SPR.odyAf = flipSprite(SPR.odyA); SPR.odyBf = flipSprite(SPR.odyB);
SPR.odyHit = tintSprite(SPR.odyA, '#ffffff');
SPR.odySide = makeSprite(ODY_SIDE, ODY_PAL);
SPR.pen = makeSprite(PEN_BODY, PEN_PAL);

const suitorCache = {};
function suitorSprite(hair, tunic, frame, helm, crown) {
  const key = hair + tunic[0] + frame + (helm ? 'H' : '') + (crown ? 'C' : '');
  let s = suitorCache[key];
  if (!s) {
    const rows = SUITOR_BODY.slice();
    if (helm) rows[0] = HELM_TOP;
    if (crown) { rows[1] = CROWN[0]; rows[2] = CROWN[1]; }
    const pal = { k: '#140e0a', h: hair, s: '#d49a6e', e: '#120c08', t: tunic[0], u: tunic[1], g: '#c9a24a', f: '#5a3a1e', c: '#a8302a' };
    const img = makeSprite(rows.concat(frame ? LEGS_SB : LEGS_SA), pal);
    s = suitorCache[key] = { img, hit: tintSprite(img, '#ffffff'), red: tintSprite(img, '#ff3a2a') };
  }
  return s;
}

// 회전 무기 스프라이트
SPR.sword = makeSprite([
  '..w..', '.wsw.', '.wsw.', '.wsw.', '.wsw.', '.wsw.', '.wsw.', '.wsw.', 'ggggg', '..b..', '..b..', '..g..',
], { w: '#eef3f6', s: '#9aa6b0', g: '#c9a24a', b: '#6b4526' });
SPR.axe = makeSprite([
  'ws..b..sw', 'wss.b.ssw', 'wsssbsssw', 'wss.b.ssw', 'ws..b..sw', '....b....', '....b....', '....b....', '....b....', '....b....', '....b....', '....d....',
], { w: '#eef3f6', s: '#8c96a0', b: '#7a5030', d: '#3a2414' });

function makeIcon(draw) {
  const c = document.createElement('canvas'); c.width = 13; c.height = 13;
  const g = c.getContext('2d'); draw(g); return c.toDataURL();
}
$('icoBow').src = makeIcon(g => {
  g.fillStyle = '#8a5a2a';
  [[5, 0], [4, 1], [3, 2], [2, 3], [2, 4], [1, 5], [1, 6], [1, 7], [2, 8], [2, 9], [3, 10], [4, 11], [5, 12]].forEach(([x, y]) => g.fillRect(x, y, 2, 1));
  g.fillStyle = '#e8e0c8'; g.fillRect(6, 0, 1, 13);
  g.fillStyle = '#cfd6dc'; g.fillRect(2, 6, 9, 1); g.fillStyle = '#eef3f6'; g.fillRect(11, 5, 1, 3); g.fillRect(12, 6, 1, 1);
  g.fillStyle = '#c0392b'; g.fillRect(2, 5, 2, 1); g.fillRect(2, 7, 2, 1);
});
$('icoSword').src = makeIcon(g => g.drawImage(SPR.sword, 4, 0));
$('icoAxe').src = makeIcon(g => g.drawImage(SPR.axe, 2, 0));

// =====================================================================
//  배경: 오디세우스의 집, 큰 홀
// =====================================================================
const TORCHES = [];
const AXE_PAIRS = [];
for (let i = 0; i < 6; i++) AXE_PAIRS.push(200 + i * 48);

function buildBG() {
  const c = document.createElement('canvas'); c.width = MAPW; c.height = MAPH;
  const g = c.getContext('2d');
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // 바닥 석판
  for (let ty = 0; ty < MAPH; ty += 16) for (let tx = 0; tx < MAPW; tx += 16) {
    const alt = ((tx + ty) / 16) % 2 === 0;

  G.boss = { ...B, x: pt.x, y: pt.y, hp: B.hp, max: B.hp, r: 11, state: 'chase', t: 0, cdT: 2, dx: 0, dy: 0, flash: 0, red: 0, cd: { sword: 0, axe: 0 }, wpn: B.w, walk: 0, face: 1, chain: 0, slamR: 0, slamHit: false };
  $('bossName').textContent = B.name; $('bossFill').style.width = '100%'; $('bossBar').classList.remove('hidden');
  showCaption('안티노오스 등장', B.name); setTimeout(() => { if (G && G.boss && G.state === 'play') hideCaption(); }, 1800);
  SFX.horn(); startMusic('boss');
}
function dropWeapon(x, y, from) {
  let type = from && from.wpn.filter(w => w !== 'spear').length ? pick(from.wpn.filter(w => w !== 'spear')) : null;
  if (!type || !from) {   // 자동 생성: 플레이어 근처 화면 안
    type = pick(['sword', 'axe']);
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2, d = rand(50, 85);
      x = clamp(G.p.x + Math.cos(a) * d, PLAY.x0 + 6, PLAY.x1 - 6); y = clamp(G.p.y + Math.sin(a) * d, PLAY.y0 + 10, PLAY.y1 - 6);
      if (inView(x, y, -16)) break;
    }
    burst(x, y - 6, '#e8c56a', 14, 50);
  }
  G.items.push({ type, x, y, t: 0 });
}

// ---------- 파티클 ----------
function burst(x, y, col, n, spd) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = rand(.3, 1) * spd; G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.25, .55), max: .55, col, sz: Math.random() < .3 ? 2 : 1 }); }
}

// ---------- 전투 ----------
function hurtEnemy(e, dmg, kx, ky, knock, boss) {
  e.hp -= dmg; e.flash = .08;
  if (!boss && knock) { e.kx += kx * knock * 10; e.ky += ky * knock * 10; }
  if (e.hp <= 0) boss ? killBoss() : killEnemy(e);
}
function killEnemy(e) {
  const i = G.enemies.indexOf(e); if (i < 0) return;
  G.enemies.splice(i, 1);
  G.kills++; G.totalKills++;
  burst(e.x, e.y - 6, '#d8c8a8', 8, 40); burst(e.x, e.y - 6, '#8a2020', 5, 30);
  const s = suitorSprite(e.hair, e.tunic, 0, e.helm, false);
  G.parts.push({ corpse: s.img, x: e.x, y: e.y, life: .6, max: .6, face: e.face });
  SFX.die();
  if (G.dropAt.includes(G.kills)) dropWeapon(e.x, e.y, e.wpn.length ? e : null);
  if (G.kills >= ENEMIES_PER_STAGE && !G.boss) G.bossT = 1.4;
}
function killBoss() {
  const b = G.boss; if (!b || G.state !== 'play') return;
  burst(b.x, b.y - 12, '#e8c56a', 40, 90); burst(b.x, b.y - 12, '#8a2020', 24, 60);
  G.parts.push({ corpse: suitorSprite('#1a1a1a', b.tunic, 0, false, true).img, x: b.x, y: b.y, life: 1.2, max: 1.2, face: b.face, big: true });
  G.boss = null; $('bossBar').classList.add('hidden');
  if (DBG.log) DBG.log.push({ s: G.stage, t: +G.stageTime.toFixed(1), hp: G.p.hp, w: G.weapons.sword + '/' + G.weapons.axe });
  SFX.bossDie(); stopMusic(); setTimeout(SFX.clear, 500);
  // 남은 무기는 자동으로 획득
  for (const it of G.items) G.weapons[it.type]++;
  if (G.items.length) toast('남은 무기를 챙겼다');
  G.items = [];
  G.state = 'clear'; G.t = 0;
  showCaption(G.stage >= 8 ? '모든 구혼자를 물리쳤다' : '스테이지 클리어!', G.stage >= 8 ? '' : '다음 스테이지에서 체력이 모두 회복됩니다');
}
function damagePlayer(d) {
  const p = G.p; if (p.inv > 0 || DBG.god) return;
  p.hp = Math.max(0, p.hp - d); p.inv = INVULN; G.shake = .25; SFX.hurt();
  burst(p.x, p.y - 8, '#c0392b', 8, 40);
  if (p.hp <= 0) {
    G.state = 'dying'; G.t = 0; stopMusic(); SFX.over();
    $('bossBar').classList.add('hidden'); hideCaption();
  }
}

// ---------- 회전 무기 위치 ----------
function orbitBlades() {
  const out = [], p = G.p, cx = p.x, cy = p.y - 7;
  const ns = G.weapons.sword, na = G.weapons.axe;
  for (let i = 0; i < ns; i++) { const a = G.swordAng + i * Math.PI * 2 / ns; out.push({ type: 'sword', a, x: cx + Math.cos(a) * SWORD.radius, y: cy + Math.sin(a) * SWORD.radius }); }
  for (let i = 0; i < na; i++) { const a = G.axeAng + i * Math.PI * 2 / na; out.push({ type: 'axe', a, x: cx + Math.cos(a) * AXE.radius, y: cy + Math.sin(a) * AXE.radius }); }
  return out;
}

// =====================================================================
//  업데이트
// =====================================================================
function update(dt) {
  if (!G) { titleT += dt; return; }
  if (paused) return;
  G.t += dt;
  switch (G.state) {
    case 'intro':
      if (G.t >= 2.9) { G.state = 'caption'; G.t = 0; $('hud').classList.remove('hidden'); updateHud(); showCaption('스테이지 ' + G.stage, STAGES[G.stage - 1].sub); }
      break;
    case 'caption':
      if (G.t >= 1.7) { G.state = 'play'; G.t = 0; hideCaption(); startMusic('stage'); }
      break;
    case 'play':
      G.playTime += dt; G.stageTime += dt; updatePlay(dt); updateHud(); break;
    case 'clear':
      updateParts(dt); movePlayer(dt); updateCam(dt);
      if (G.t >= 3) { hideCaption(); if (G.stage >= 8) startEnding(); else { G.stage++; beginStage(); } }
      break;
    case 'dying':
      updateParts(dt); updateCam(dt);
      if (G.t >= 1.5) { G.state = 'over'; $('overInfo').textContent = '스테이지 ' + G.stage + ' · 처치 ' + G.kills + ' / ' + ENEMIES_PER_STAGE; $('overScr').classList.remove('hidden'); $('retryBtn').focus(); }
      break;
    case 'ending': updateEnding(); break;
  }
}

function movePlayer(dt) {
  const p = G.p;
  let dx = (keys.r ? 1 : 0) - (keys.l ? 1 : 0), dy = (keys.d ? 1 : 0) - (keys.u ? 1 : 0);
  p.moving = !!(dx || dy);
  if (p.moving) {
    const l = Math.hypot(dx, dy); dx /= l; dy /= l; p.fx = dx; p.fy = dy;
    p.x = clamp(p.x + dx * PLAYER_SPEED * dt, PLAY.x0, PLAY.x1); p.y = clamp(p.y + dy * PLAYER_SPEED * dt, PLAY.y0, PLAY.y1);
    p.walk += dt * 7;
  }
}

function updatePlay(dt) {
  const p = G.p;
  movePlayer(dt);
  if (p.inv > 0) p.inv -= dt;

  // 구혼자 등장
  if (G.spawned < ENEMIES_PER_STAGE) {
    G.spawnT -= dt;
    if (G.enemies.length === 0) G.spawnT = Math.min(G.spawnT, 1);
    if (G.spawnT <= 0) { spawnGroup(); G.spawnT = rand(2.9, 3.9) - G.stage * .06; }
  }
  if (G.bossT > 0) { G.bossT -= dt; if (G.bossT <= 0) spawnBoss(); }

  // 활 — 바라보는 방향 우선, 가장 가까운 적
  G.fireT -= dt;
  if (G.fireT <= 0) {
    let best = null, bs = 1e9;
    const consider = e => {
      const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy);
      if (d > BOW.range) return;
      const score = d + ((dx * p.fx + dy * p.fy) >= 0 ? 0 : 1000);
      if (score < bs) { bs = score; best = e; }
    };
    G.enemies.forEach(consider); if (G.boss) consider(G.boss);
    if (best) {
      const sx = p.x, sy = p.y - 8, tx = best.x, ty = best.y - (best === G.boss ? 14 : 7), l = Math.hypot(tx - sx, ty - sy) || 1;
      G.arrows.push({ x: sx, y: sy, vx: (tx - sx) / l * BOW.speed, vy: (ty - sy) / l * BOW.speed, tgt: best, life: 1.4 });
      G.fireT = BOW.interval; SFX.shoot();
    } else G.fireT = .1;
  }
  // 화살 (추적)
  for (let i = G.arrows.length - 1; i >= 0; i--) {
    const a = G.arrows[i]; a.life -= dt;
    const t = a.tgt, alive = t && (t === G.boss || G.enemies.includes(t));
    if (alive) {
      const ty = t.y - (t === G.boss ? 14 : 7), dx = t.x - a.x, dy = ty - a.y, l = Math.hypot(dx, dy) || 1;
      a.vx += dx / l * BOW.speed * dt * 14; a.vy += dy / l * BOW.speed * dt * 14;
      const v = Math.hypot(a.vx, a.vy); a.vx = a.vx / v * BOW.speed; a.vy = a.vy / v * BOW.speed;
    }
    a.x += a.vx * dt; a.y += a.vy * dt;
    let hit = null;
    for (const e of G.enemies) if ((e.x - a.x) ** 2 + (e.y - 7 - a.y) ** 2 < (e.r + 2) ** 2) { hit = e; break; }
    if (!hit && G.boss && (G.boss.x - a.x) ** 2 + (G.boss.y - 14 - a.y) ** 2 < (G.boss.r + 3) ** 2) hit = G.boss;
    if (hit) {
      const v = Math.hypot(a.vx, a.vy);
      burst(a.x, a.y, '#f0e0c0', 5, 40); SFX.hit();
      hurtEnemy(hit, BOW.dmg, a.vx / v, a.vy / v, 1.2, hit === G.boss);
      G.arrows.splice(i, 1); continue;
    }
    if (a.life <= 0 || a.x < 0 || a.y < 0 || a.x > MAPW || a.y > MAPH) G.arrows.splice(i, 1);
  }

  // 회전하는 검·도끼
  G.swordAng += SWORD.spin * dt; G.axeAng += AXE.spin * dt;
  const blades = orbitBlades();
  if (blades.length) {
    const targets = G.enemies.slice(); if (G.boss) targets.push(G.boss);
    for (const e of targets) {
      const isB = e === G.boss, ey = e.y - (isB ? 12 : 7);
      e.cd.sword -= dt; e.cd.axe -= dt;
      for (const [type, W_] of [['sword', SWORD], ['axe', AXE]]) {
        if (e.cd[type] > 0) continue;
        for (const b of blades) {
          if (b.type !== type) continue;
          if ((b.x - e.x) ** 2 + (b.y - ey) ** 2 < (W_.hit + e.r) ** 2) {
            const kx = e.x - p.x, ky = e.y - p.y, l = Math.hypot(kx, ky) || 1;
            e.cd[type] = W_.tick;
            burst(b.x, b.y, type === 'axe' ? '#ffffff' : '#cfe0ff', 2, 30);
            type === 'axe' ? SFX.chop() : SFX.slash();
            hurtEnemy(e, W_.dmg, kx / l, ky / l, W_.knock / 10, isB);
            break;
          }
        }
        if (isB && !G.boss) return;
      }
    }
  }

  // 구혼자 이동
  for (const e of G.enemies) {
    const dx = p.x - e.x, dy = p.y - e.y, l = Math.hypot(dx, dy) || 1;
    e.x += (dx / l * e.spd + e.kx) * dt; e.y += (dy / l * e.spd + e.ky) * dt;
    e.kx *= Math.pow(.0005, dt); e.ky *= Math.pow(.0005, dt);
    e.face = dx < 0 ? -1 : 1; e.walk += dt * 6; if (e.flash > 0) e.flash -= dt;
    e.x = clamp(e.x, PLAY.x0, PLAY.x1); e.y = clamp(e.y, PLAY.y0, PLAY.y1);
    if (l < e.r + 5) damagePlayer(e.dmg);
  }
  // 서로 밀어내기
  const es = G.enemies;
  for (let i = 0; i < es.length; i++) for (let j = i + 1; j < es.length; j++) {
    const a = es[i], b = es[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if (d2 < 100 && d2 > .0001) { const d = Math.sqrt(d2), push = (10 - d) * .5, nx = dx / d, ny = dy / d; a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push; }
  }
  if (G.state !== 'play') return;

  updateBoss(dt);
  if (G.state !== 'play') return;

  // 무기 줍기
  for (let i = G.items.length - 1; i >= 0; i--) {
    const it = G.items[i]; it.t += dt;
    if (dist2(it, p) < 13 * 13) {
      G.weapons[it.type]++; G.items.splice(i, 1);
      SFX.pickup(); burst(it.x, it.y - 6, '#e8c56a', 12, 50);
      toast((it.type === 'sword' ? '검' : '도끼') + ' 획득! ×' + G.weapons[it.type]);
    }
  }
  updateParts(dt);
  updateCam(dt);
}

function updateBoss(dt) {
  const b = G.boss, p = G.p; if (!b) return;
  b.t -= dt; if (b.flash > 0) b.flash -= dt;
  const dx = p.x - b.x, dy = p.y - b.y, l = Math.hypot(dx, dy) || 1;
  const chase = spd => { b.x += dx / l * spd * dt; b.y += dy / l * spd * dt; b.walk += dt * 5; b.face = dx < 0 ? -1 : 1; };
  switch (b.state) {
    case 'chase':
      chase(b.spd); b.cdT -= dt;
      if (b.cdT <= 0) {
        b.ab_ = pick(b.ab); b.state = 'tele'; b.t = b.ab_ === 'spin' ? .5 : .65;
        b.dx = dx / l; b.dy = dy / l; b.chain = b.ab_ === 'triple' ? 3 : 1; SFX.tele();
      }
      break;
    case 'tele':
      if (b.ab_ === 'dash' || b.ab_ === 'triple') { b.dx = dx / l; b.dy = dy / l; }   // 조준 유지
      if (b.t <= 0) {
        if (b.ab_ === 'dash' || b.ab_ === 'triple') { b.state = 'dash'; b.t = .42; SFX.dash(); }
        else if (b.ab_ === 'slam') { b.state = 'slam'; b.t = .45; b.slamR = 0; b.slamHit = false; SFX.slam(); G.shake = .2; }
        else { b.state = 'spin'; b.t = 1.4; }
      }
      break;
    case 'dash':
      b.x += b.dx * 230 * dt; b.y += b.dy * 230 * dt; b.face = b.dx < 0 ? -1 : 1;
      if (Math.random() < .6) G.parts.push({ x: b.x + rand(-4, 4), y: b.y - rand(0, 4), vx: 0, vy: -10, life: .3, max: .3, col: '#9a8a70', sz: 2 });
      if (b.t <= 0) {
        b.chain--;
        if (b.chain > 0) { b.state = 'tele'; b.t = .32; b.ab_ = 'triple'; SFX.tele(); }
        else { b.state = 'recover'; b.t = .5; }
      }
      break;
    case 'slam': {
      b.slamR = 70 * (1 - b.t / .45);
      if (!b.slamHit && Math.abs(Math.hypot(p.x - b.x, p.y - b.y) - b.slamR) < 7) { b.slamHit = true; damagePlayer(b.dmg); }
      if (b.t <= 0) { b.state = 'recover'; b.t = .45; }
      break;
    }
    case 'spin':
      chase(b.spd * .9);
      if (l < 27) damagePlayer(b.dmg);
      if (b.t <= 0) { b.state = 'recover'; b.t = .5; }
      break;
    case 'recover':
      if (b.t <= 0) { b.state = 'chase'; b.cdT = b.acd * rand(.85, 1.15); }
      break;
  }
  b.x = clamp(b.x, PLAY.x0, PLAY.x1); b.y = clamp(b.y, PLAY.y0, PLAY.y1);
  if (l < b.r + 5) damagePlayer(b.dmg);
  // 보스는 구혼자들을 밀어낸다
  for (const e of G.enemies) { const ex = e.x - b.x, ey = e.y - b.y, d2 = ex * ex + ey * ey; if (d2 < 256 && d2 > .01) { const d = Math.sqrt(d2); e.x += ex / d * (16 - d) * .5; e.y += ey / d * (16 - d) * .5; } }
}

function updateParts(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i]; q.life -= dt;
    if (!q.corpse) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .9; q.vy *= .9; }
    if (q.life <= 0) G.parts.splice(i, 1);
  }
}

function drawHeld(kind, hx, hy, side, sc, t) {
  const R = (x, y, w, h, c) => rect(hx + x * sc, hy + y * sc, w * sc, h * sc, c);
  if (kind === 'sword') {
    R(0, -9, 1, 8, '#e8eef2'); R(1, -9, 1, 8, '#9aa6b0'); R(-1, -1, 4, 1, '#c9a24a'); R(0, 0, 2, 2, '#6b4526');
  } else if (kind === 'axe') {
    R(0, -8, 1, 11, '#7a5030');
    const ox = side > 0 ? 1 : -3;
    R(ox, -9, 3, 4, '#8c96a0'); R(side > 0 ? ox + 3 : ox - 1, -9, 1, 4, '#e8eef2');
  } else if (kind === 'spear') {
    R(0, -13, 1, 17, '#8a6038'); R(-1, -14, 3, 1, '#b08a3a'); R(0, -17, 1, 3, '#d8b860'); R(-1, -15, 3, 1, '#d8b860');
  }
}
function drawSuitor(e, sc, isBoss) {
  const frame = (Math.floor(e.walk * 2) % 2);
  const s = suitorSprite(e.hair || '#1a1a1a', e.tunic, frame, e.helm, isBoss);
  const w = 16 * sc, x = Math.round(e.x - G.cam.x - w / 2), y = Math.round(e.y - G.cam.y - w + 2 * sc);
  rect(x + 3 * sc, y + w - 2 * sc, 10 * sc, 2 * sc, 'rgba(0,0,0,.35)');
  let img = s.img;
  if (e.flash > 0) img = s.hit;
  ctx.save();
  if (e.face < 0) { ctx.translate(x * 2 + w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(img, x, y, w, w);
  if (isBoss && e.state === 'tele' && Math.floor(G.t * 16) % 2) { ctx.globalAlpha = .6; ctx.drawImage(s.red, x, y, w, w); ctx.globalAlpha = 1; }
  // 들고 있는 무기 (앞손 = 오른쪽, 뒷손 = 왼쪽)
  const wob = Math.sin(e.walk * 3) * sc;
  const spinning = isBoss && e.state === 'spin';
  if (!spinning) {
    if (e.wpn[0]) drawHeld(e.wpn[0], x + 13 * sc, y + 10 * sc + wob, 1, sc);
    if (e.wpn[1]) drawHeld(e.wpn[1], x + 2 * sc, y + 10 * sc - wob, -1, sc);
  }
  ctx.restore();
  if (isBoss && e.gold) rect(x + 7 * sc, y + 1 * sc, 2 * sc, 1 * sc, '#ffe08a');
}
function drawPlayer() {
  const p = G.p;
  if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0 && G.state === 'play') return;
  const frame = p.moving && Math.floor(p.walk) % 2 ? 'B' : 'A';
  const flip = p.fx < 0;
  const img = SPR['ody' + frame + (flip ? 'f' : '')];
  const x = Math.round(p.x - G.cam.x - 8), y = Math.round(p.y - G.cam.y - 14);
  rect(x + 3, y + 14, 10, 2, 'rgba(0,0,0,.35)');
  if (G.state === 'dying' || G.state === 'over') { ctx.save(); ctx.translate(x + 8, y + 14); ctx.rotate(Math.min(1, G.t * 2) * Math.PI / 2 * (flip ? -1 : 1)); ctx.drawImage(SPR.odyA, -8, -14); ctx.restore(); return; }
  ctx.drawImage(img, x, y);
  // 등 뒤 활
  const bx = flip ? x + 14 : x + 1;
  rect(bx, y + 6, 1, 9, '#7a4a20'); rect(bx + (flip ? 1 : -1), y + 8, 1, 5, '#7a4a20'); rect(flip ? bx - 1 : bx + 1, y + 6, 1, 9, 'rgba(230,220,190,.6)');
}
function drawHpBar() {
  const p = G.p, x = Math.round(p.x - G.cam.x - 9), y = Math.round(p.y - G.cam.y - 20);
  const r = p.hp / PLAYER_HP;
  rect(x - 1, y - 1, 20, 4, '#000');
  rect(x, y, 18, 2, '#3a1010');
  rect(x, y, Math.round(18 * r), 2, r > .5 ? '#5ac85a' : r > .25 ? '#e8c040' : '#e04030');
}
function drawRingPx(cx, cy, r, col, thick) {
  ctx.fillStyle = col;
  const n = Math.max(12, Math.floor(r * 2.2));
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r * .8), thick, thick); }
}
function drawTorches(cx, cy) {
  for (const t of TORCHES) {
    const x = t.x - cx, y = t.y - cy; if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
    const f = Math.sin(performance.now() / 90 + t.x) * 1;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(x, y, 1, x, y, 34 + f * 2); gr.addColorStop(0, 'rgba(255,150,50,.35)'); gr.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = gr; ctx.fillRect(x - 40, y - 40, 80, 80); ctx.restore();
    rect(x - 2, y - 3, 5, 4, '#e86a20'); rect(x - 1, y - 6 + f, 3, 4, '#f8b040'); rect(x, y - 8 + f, 1, 3, '#fff0a0');
  }
}

function drawWorld() {
  const sh = G.shake > 0 ? G.shake * 12 : 0;
  const cx = Math.round(G.cam.x + rand(-sh, sh)), cy = Math.round(G.cam.y + rand(-sh, sh));
  const camSave = { ...G.cam }; G.cam.x = cx; G.cam.y = cy;
  ctx.drawImage(BG, -cx, -cy);
  drawTorches(cx, cy);

  // 보스 충격파
  const b = G.boss;
  if (b && b.state === 'slam') { drawRingPx(b.x - cx, b.y - cy, b.slamR, '#f0d080', 2); drawRingPx(b.x - cx, b.y - cy, b.slamR * .8, 'rgba(240,160,80,.6)', 1); }
  if (b && b.state === 'tele' && b.ab_ === 'slam') drawRingPx(b.x - cx, b.y - cy, 70, Math.floor(G.t * 12) % 2 ? 'rgba(255,60,40,.7)' : 'rgba(255,60,40,.25)', 1);
  if (b && b.state === 'tele' && (b.ab_ === 'dash' || b.ab_ === 'triple')) {
    ctx.fillStyle = 'rgba(255,60,40,.5)';
    for (let i = 8; i < 96; i += 4) ctx.fillRect(Math.round(b.x - cx + b.dx * i), Math.round(b.y - 6 - cy + b.dy * i), 2, 2);
  }

  // y 정렬 그리기
  const list = [];
  for (const ax of AXE_PAIRS) list.push({ y: AXE_ROW_Y, f: () => { drawDecorAxe(ax - 5 - cx, AXE_ROW_Y - cy); drawDecorAxe(ax + 5 - cx, AXE_ROW_Y - cy); } });
  for (const it of G.items) list.push({ y: it.y, f: () => drawItem(it, cx, cy) });
  for (const e of G.enemies) if (inView(e.x, e.y, 24)) list.push({ y: e.y, f: () => drawSuitor(e, 1, false) });
  if (b) list.push({ y: b.y, f: () => drawSuitor(b, 2, true) });
  for (const q of G.parts) if (q.corpse) list.push({ y: q.y, f: () => drawCorpse(q, cx, cy) });
  list.push({ y: G.p.y, f: drawPlayer });
  list.sort((a, b2) => a.y - b2.y).forEach(o => o.f());

  // 보스 회전베기
  if (b && b.state === 'spin') {
    const a0 = G.t * 14;
    for (let i = 0; i < 3; i++) {
      const a = a0 + i * Math.PI * 2 / 3, kind = b.w[i % b.w.length] || 'sword';
      drawSpinning(kind === 'axe' ? SPR.axe : SPR.sword, b.x - cx + Math.cos(a) * 22, b.y - 12 - cy + Math.sin(a) * 22, a + Math.PI / 2);
    }
    drawRingPx(b.x - cx, b.y - 12 - cy, 26, 'rgba(255,255,255,.25)', 1);
  }
  // 회전 무기
  if (G.state === 'play' || G.state === 'clear' || G.state === 'caption') {
    for (const bl of orbitBlades()) {
      if (bl.type === 'sword') drawSpinning(SPR.sword, bl.x - cx, bl.y - cy, bl.a + Math.PI / 2);
      else drawSpinning(SPR.axe, bl.x - cx, bl.y - cy, G.t * 9);
    }
  }
  // 화살
  for (const a of G.arrows) {
    const v = Math.hypot(a.vx, a.vy), ux = a.vx / v, uy = a.vy / v;
    for (let i = 0; i < 7; i++) rect(a.x - cx - ux * i, a.y - cy - uy * i, 1, 1, i === 0 ? '#ffffff' : i > 4 ? '#c0392b' : '#c8a070');
  }
  // 파티클
  for (const q of G.parts) if (!q.corpse) { ctx.globalAlpha = clamp(q.life / q.max * 1.5, 0, 1); rect(q.x - cx, q.y - cy, q.sz, q.sz, q.col); }
  ctx.globalAlpha = 1;
  if (G.state === 'play' || G.state === 'clear') drawHpBar();
  drawIndicators(cx, cy);
  ctx.drawImage(VIGNETTE, 0, 0);
  G.cam.x = camSave.x; G.cam.y = camSave.y;
}
function drawSpinning(img, x, y, ang) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(ang); ctx.drawImage(img, -Math.floor(img.width / 2), -Math.floor(img.height / 2)); ctx.restore();
}
function drawItem(it, cx, cy) {
  const x = it.x - cx, y = it.y - cy, bob = Math.round(Math.sin(it.t * 4) * 2);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const gr = ctx.createRadialGradient(x, y - 6, 1, x, y - 6, 14); gr.addColorStop(0, 'rgba(255,220,120,.55)'); gr.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.fillStyle = gr; ctx.fillRect(x - 16, y - 22, 32, 32); ctx.restore();
  rect(x - 4, y, 9, 2, 'rgba(0,0,0,.35)');
  const img = it.type === 'sword' ? SPR.sword : SPR.axe;
  ctx.drawImage(img, Math.round(x - img.width / 2), Math.round(y - 14 + bob));
  if (Math.floor(it.t * 3) % 2) rect(x + 5, y - 16 + bob, 1, 1, '#ffffff');
}
function drawCorpse(q, cx, cy) {
  const sc = q.big ? 2 : 1;
  ctx.save(); ctx.globalAlpha = clamp(q.life / q.max * 2, 0, 1);
  ctx.translate(Math.round(q.x - cx), Math.round(q.y - cy)); ctx.rotate((q.face < 0 ? -1 : 1) * Math.PI / 2 * Math.min(1, (q.max - q.life) * 6));
  ctx.drawImage(q.corpse, -8 * sc, -14 * sc, 16 * sc, 16 * sc); ctx.restore();
}
function drawIndicators(cx, cy) {
  const pts = G.items.map(it => ({ x: it.x, y: it.y - 6, col: '#e8c56a' }));
  if (G.boss) pts.push({ x: G.boss.x, y: G.boss.y - 12, col: '#ff5a3a' });
  for (const t of pts) {
    const sx = t.x - cx, sy = t.y - cy;
    if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) continue;
    const ex = clamp(sx, 8, W - 8), ey = clamp(sy, 24, H - 8);
    if (Math.floor(performance.now() / 250) % 2) continue;
    const a = Math.atan2(sy - ey, sx - ex);
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = t.col;
    ctx.fillRect(0, -1, 4, 3); ctx.fillRect(-2, -3, 2, 7); ctx.fillRect(4, 0, 1, 1); ctx.restore();
  }
}

// ---------- 오프닝: 암전 → 활시위를 당기는 오디세우스 → 띵 ----------
function drawIntro(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const light = clamp(t / .9, 0, 1);
  // 어둠 속 연회장 실루엣
  ctx.globalAlpha = light * .35;
  ctx.drawImage(BG, 160, 30, W, H, 0, 0, W, H);
  ctx.globalAlpha = 1;
  const gr = ctx.createRadialGradient(130, 100, 4, 130, 100, 120);
  gr.addColorStop(0, `rgba(150,95,40,${.45 * light})`); gr.addColorStop(.6, `rgba(60,30,10,${.25 * light})`); gr.addColorStop(1, 'rgba(0,0,0,.85)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  const S = 4, ox = 104, oy = 40;
  const P = (x, y, c, w = 1, h = 1) => rect(ox + x * S, oy + y * S, w * S, h * S, c);
  // 그림자
  rect(ox + 1 * S, oy + 16 * S - 2, 10 * S, 4, 'rgba(0,0,0,.5)');
  ctx.drawImage(SPR.odySide, ox, oy, 16 * S, 16 * S);
  // 시위 당기기 (0.9 ~ 1.9초) → 놓기 (1.9초, 띵)
  let pull = 0, vib = 0;
  if (t >= .9 && t < 1.9) { const k = (t - .9) / 1; pull = 1 - Math.pow(1 - k, 2); }
  if (t >= 1.9) { const k = t - 1.9; vib = Math.sin(k * 90) * 1.6 * Math.exp(-k * 4); }
  const grip = 15, tipT = 1, tipB = 17, mid = 9;
  // 활
  for (let y = tipT; y <= tipB; y++) { const u = (y - mid) / (mid - tipT); const bx = 12 + Math.round((3 + pull * .8) * (1 - u * u)); P(bx, y, y === mid ? '#3a2410' : '#7a4a20'); if (Math.abs(u) < .9) P(bx + 1, y, '#4a2a10'); }
  // 시위
  const sx = 12 - pull * 6 + vib;
  ctx.fillStyle = '#e8dcc0';
  for (let i = 0; i <= 40; i++) {
    const k = i / 40, yy = tipT + (tipB - tipT) * k;
    const xx = k < .5 ? 12 + (sx - 12) * (k / .5) : sx + (12 - sx) * ((k - .5) / .5);
    ctx.fillRect(Math.round(ox + xx * S + 1), Math.round(oy + yy * S + 1), 2, 2);
  }
  // 팔: 앞팔은 활 손잡이, 뒷팔은 시위
  for (let x = 7; x < grip; x++) P(x, 9, x > grip - 3 ? '#c48a5e' : '#7d6646');
  P(grip - 1, 8, '#c48a5e', 2, 2);
  const hx = Math.round(Math.max(sx - .5, 6));
  for (let x = 6; x <= hx; x++) P(x, 10, '#6a5438');
  P(hx, 9, '#c48a5e', 1, 2);
  // 띵! 순간의 빛
  if (t >= 1.9 && t < 2.15) { ctx.fillStyle = `rgba(255,240,200,${.35 * (1 - (t - 1.9) / .25)})`; ctx.fillRect(0, 0, W, H); }
  if (t >= 1.9 && t < 2.6) {   // 진동선
    ctx.fillStyle = `rgba(255,240,200,${1 - (t - 1.9) / .7})`;
    for (let i = 0; i < 3; i++) { const r = 6 + (t - 1.9) * 60 + i * 6; ctx.fillRect(Math.round(ox + 12 * S - r), Math.round(oy + mid * S), 2, 1); ctx.fillRect(Math.round(ox + 12 * S - r * .7), Math.round(oy + mid * S - r * .7), 1, 1); ctx.fillRect(Math.round(ox + 12 * S - r * .7), Math.round(oy + mid * S + r * .7), 1, 1); }
  }
  // 페이드 인 / 페이드 아웃
  let dark = 1 - light;
  if (t > 2.55) dark = clamp((t - 2.55) / .35, 0, 1);
  if (dark > 0) { ctx.fillStyle = `rgba(0,0,0,${dark})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- 타이틀 배경 ----------
function drawTitle() {
  const x = 160 + Math.sin(titleT * .12) * 150, y = 60 + Math.sin(titleT * .07) * 20;
  ctx.drawImage(BG, -Math.round(x), -Math.round(y));
  drawTorches(Math.round(x), Math.round(y));
  for (const ax of AXE_PAIRS) { drawDecorAxe(ax - 5 - x, AXE_ROW_Y - y); drawDecorAxe(ax + 5 - x, AXE_ROW_Y - y); }
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(VIGNETTE, 0, 0);
}

// ---------- 엔딩: 페넬로페와의 재회 ----------
function startEnding() {
  G.state = 'ending'; G.t = 0; G.endStep = 0;
  $('hud').classList.add('hidden'); hideCaption();
  const et = $('endText'); et.classList.remove('hidden'); et.querySelectorAll('p,.btn').forEach(e => e.classList.remove('on'));
  const s = Math.floor(G.playTime), mm = Math.floor(s / 60), ss = String(s % 60).padStart(2, '0');
  $('endStats').textContent = '플레이 시간 ' + mm + ':' + ss + ' · 쓰러뜨린 구혼자 ' + G.totalKills + '명';
  startMusic('end');
}
function updateEnding() {
  const marks = [3.6, 6.2, 8.8, 11.6, 13.4, 14.4];
  const els = [...$('endText').querySelectorAll('p,.btn')];
  while (G.endStep < marks.length && G.t >= marks[G.endStep]) { els[G.endStep].classList.add('on'); G.endStep++; }
}
function drawEnding(t) {
  // 정적이 내려앉은 연회장, 난롯불
  ctx.drawImage(BG, -160, -100);
  for (const ax of AXE_PAIRS) { drawDecorAxe(ax - 5 - 160, AXE_ROW_Y - 100); drawDecorAxe(ax + 5 - 160, AXE_ROW_Y - 100); }
  drawTorches(160, 100);
  ctx.fillStyle = 'rgba(20,8,0,.45)'; ctx.fillRect(0, 0, W, H);
  const meet = clamp(t / 3.2, 0, 1), e = 1 - Math.pow(1 - meet, 2);
  const ox = 70 + e * 66, px = 250 - e * 66, y = 40;
  const walking = meet < 1;
  // 가운데 따뜻한 빛
  const gr = ctx.createRadialGradient(160, 58, 2, 160, 58, 70 + Math.sin(t * 3) * 2);
  gr.addColorStop(0, `rgba(255,190,110,${.18 + .2 * meet})`); gr.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); ctx.restore();
  const fr = walking && Math.floor(t * 4) % 2;
  rect(ox - 10, y + 28, 20, 4, 'rgba(0,0,0,.4)'); rect(px - 10, y + 28, 20, 4, 'rgba(0,0,0,.4)');
  ctx.drawImage(fr ? SPR.odyB : SPR.odyA, Math.round(ox - 16), y, 32, 32);
  ctx.drawImage(SPR.pen, Math.round(px - 16), y + (walking && Math.floor(t * 4 + 1) % 2 ? -1 : 0), 32, 32);
  // 만남 이후 금빛 입자
  if (meet >= 1) {
    for (let i = 0; i < 18; i++) {
      const k = (t * .25 + i * .137) % 1, xx = 160 + Math.sin(i * 2.3 + t) * 34, yy = 72 - k * 56;
      ctx.globalAlpha = Math.sin(k * Math.PI) * .9; rect(xx, yy, 1, 1, '#ffe8a0');
    }
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(VIGNETTE, 0, 0);
  if (t < 1.2) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 1.2})`; ctx.fillRect(0, 0, W, H); }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!G) { drawTitle(); return; }
  if (G.state === 'intro') { drawIntro(G.t); return; }
  if (G.state === 'ending') { drawEnding(G.t); return; }
  drawWorld();
  if (G.state === 'caption' && G.t < .35) { ctx.fillStyle = `rgba(0,0,0,${1 - G.t / .35})`; ctx.fillRect(0, 0, W, H); }
  if (G.state === 'dying' || G.state === 'over') { ctx.fillStyle = `rgba(40,0,0,${Math.min(.55, G.t * .5)})`; ctx.fillRect(0, 0, W, H); }
}

// =====================================================================
//  루프 / 화면 크기 / 버튼
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
function resize() {
  let s = Math.floor(Math.min(innerWidth / W, innerHeight / H));
  if (s < 1) s = Math.min(innerWidth / W, innerHeight / H);
  const wrap = $('wrap'); wrap.style.width = W * s + 'px'; wrap.style.height = H * s + 'px'; wrap.style.setProperty('--u', s + 'px');
}
addEventListener('resize', resize); resize();
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play' && !paused) togglePause(); });

$('startBtn').onclick = () => { initAudio(); newGame(); };
$('pauseBtn').onclick = () => { if (G && (G.state === 'play' || G.state === 'clear' || G.state === 'caption')) togglePause(); $('pauseBtn').blur(); };
$('resumeBtn').onclick = () => togglePause();
$('toTitleBtn').onclick = () => toTitle();
$('retryBtn').onclick = () => restartStage();
$('quitBtn').onclick = () => toTitle();
$('endBtn').onclick = () => toTitle();


// 개발용 디버그: #debug&stage=3&sword=2&axe=1&sim=60&circle&god&ending
if (location.hash.startsWith('#debug')) {
  const q = new URLSearchParams(location.hash.slice(7));
  DBG.god = q.has('god'); DBG.log = [];
  newGame(); G.stage = +q.get('stage') || 1; G.weapons.sword = +q.get('sword') || 0; G.weapons.axe = +q.get('axe') || 0; beginStage();
  const sim = +q.get('sim') || 0;
  for (let i = 0; i < sim * 60; i++) {
    if (q.has('kite') && G.p) {
      const p = G.p; let vx = 0, vy = 0;
      const foes = G.enemies.slice(); if (G.boss) foes.push(G.boss);
      for (const e of foes) { const dx = p.x - e.x, dy = p.y - e.y, d2 = dx * dx + dy * dy + 1; if (d2 < 4900) { vx += dx / d2; vy += dy / d2; } }
      const cxv = (320 - p.x) / 60000, cyv = (222 - p.y) / 60000; vx += cxv; vy += cyv;
      const l = Math.hypot(vx, vy) || 1; vx /= l; vy /= l;
      keys.r = vx > .38; keys.l = vx < -.38; keys.d = vy > .38; keys.u = vy < -.38;
    } else if (q.has('circle')) { const a = i / 60 * .7; keys.r = Math.cos(a) > .38; keys.l = Math.cos(a) < -.38; keys.d = Math.sin(a) > .38; keys.u = Math.sin(a) < -.38; }
    update(1 / 60);
    if (G.state === 'ending' || G.state === 'over') break;
  }
  for (const k in keys) keys[k] = false;
  if (q.has('ending')) { startEnding(); for (let i = 0; i < 60 * 16; i++) update(1 / 60); }
  document.title = JSON.stringify({ state: G.state, stage: G.stage, kills: G.kills, hp: G.p.hp, en: G.enemies.length, boss: G.boss && Math.round(G.boss.hp), w: G.weapons, log: DBG.log, total: +G.playTime.toFixed(1) });
}

requestAnimationFrame(frame);
</script>
</body>
</html>
